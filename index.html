orm:uppercase;letter-spacing:.1em}.actions a:first-child{background:var(--violet);border-color:var(--violet)}.stats{display:grid;grid-template-columns:repeat(4,1fr);padding:0 4vw;background:var(--panel)}.stats div{padding:32px 24px;border-left:1px solid var(--line)}.stats b{display:block;font:40px Arial Black;color:var(--violet)}.stats span{font:13px monospace;color:var(--muted)}section.block{padding:100px 6vw;border-bottom:1px solid var(--line)}h2{font:clamp(38px,4.8vw,76px)/1 Arial Black,Impact,sans-serif;letter-spacing:-.05em;text-transform:uppercase;margin:20px 0 55px}.profile{display:grid;grid-template-columns:.28fr 1fr;gap:45px}.big{font:clamp(22px,2.2vw,34px)/1.48 Georgia,serif;color:#d5d5df}.grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #505068}.grid article{padding:38px 35px 45px 0;border-bottom:1px solid var(--line)}.grid article:nth-child(odd){border-right:1px solid var(--line)}.grid article:nth-child(even){padding-left:35px}.grid small,.works small{color:#958bff;font:700 12px monospace;text-transform:uppercase}h3{font:23px/1.18 Arial Black,sans-serif;text-transform:uppercase;margin:22px 0 13px}.grid p,.works p,.method p{font-size:16px;line-height:1.75;color:var(--muted)}.works article{display:grid;grid-template-columns:65px 1fr auto;gap:25px;align-items:center;padding:32px 0;border-bottom:1px solid var(--line)}.works>article>b{font:26px Arial Black;color:var(--violet)}.works h3{margin:8px 0}.works p{margin:0}.tag{font:11px monospace;border:1px solid #494962;padding:9px 12px}.method{padding:95px 6vw;background:var(--violet);display:grid;grid-template-columns:1fr 1fr;gap:8vw}.method p{color:#e8e5ff}.step{display:flex;gap:20px;padding:17px 0;border-bottom:1px solid #ffffff4a}.timeline{max-width:920px;margin-left:auto}.timeline div{display:grid;grid-template-columns:190px 1fr;gap:25px;padding:24px 0;border-bottom:1px solid var(--line)}.timeline b{color:#958bff;font:13px monospace}.timeline p{margin:0;font-size:17px}.contact{padding:100px 6vw;background:var(--white);color:var(--bg)}.contact p{font:20px/1.6 Georgia,serif}.contact-grid{display:grid;grid-template-columns:1fr 1fr;margin-top:55px;border-top:1px solid #aaa}.contact-grid>*{display:flex;flex-direction:column;padding:25px 0}.contact-grid small{font:12px monospace;margin-bottom:9px}.contact-grid b{font-size:21px}footer{padding:30px 4vw;display:flex;justify-content:space-between;align-items:center}.ar{direction:rtl}.ar .timeline{margin-left:0;margin-right:auto}.ar .grid article:nth-child(odd){border-right:0;border-left:1px solid var(--line)}
